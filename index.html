<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0B1E38"/>
<meta name="description" content="CasaRD – Alquileres en República Dominicana 🇩🇴"/>
<link rel="manifest" href="manifest.json"/>
<title>CasaRD</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ══ RESET ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#F0F4FA;color:#0B1E38;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:'DM Sans',sans-serif;border:none;background:none}
input,textarea,select{font-family:'DM Sans',sans-serif;outline:none;border:none}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
img{max-width:100%;display:block;object-fit:cover}

/* ══ VARIABLES ══ */
:root{
  --azul:#0B2D5E;
  --azul-m:#1B4F8A;
  --azul-c:#2563EB;
  --azul-bg:#EBF3FF;
  --dorado:#E8A020;
  --dorado-c:#F5B832;
  --coral:#E85D3A;
  --verde:#10B981;
  --verde-bg:rgba(16,185,129,.08);
  --wa:#25D366;
  --wa-bg:rgba(37,211,102,.09);
  --oscuro:#0B1E38;
  --gris:#64748B;
  --gris-c:#94A3B8;
  --gris-l:#CBD5E1;
  --borde:#DDE5F0;
  --fondo:#F0F4FA;
  --fondo2:#F8FAFC;
  --blanco:#FFFFFF;
  --nav-h:68px;
  --r:16px;
  --r-sm:10px;
  --shadow-sm:0 2px 8px rgba(11,30,56,.08);
  --shadow:0 4px 20px rgba(11,30,56,.12);
  --shadow-lg:0 12px 40px rgba(11,30,56,.16);
  --font-t:'Fraunces',Georgia,serif;
  --font-b:'DM Sans',system-ui,sans-serif;
}

/* ══ APP SHELL ══ */
#app{min-height:100vh;padding-bottom:var(--nav-h)}
#app.no-nav{padding-bottom:0}
#page{width:100%;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══ BOTTOM NAV ══ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-h);
  background:var(--blanco);
  border-top:1px solid var(--borde);
  display:flex;align-items:center;
  padding:0 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  box-shadow:0 -4px 20px rgba(11,30,56,.07);
  z-index:500;
}
.bnav.oculto{display:none}
.ni{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;padding:6px 0;cursor:pointer;
  transition:opacity .15s;
}
.ni:active{opacity:.7}
.ni-ic{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
}
.ni-ic svg{transition:stroke .2s,fill .2s}
.ni-lb{font-size:.55rem;font-weight:600;color:var(--gris-c);letter-spacing:.02em;transition:color .2s}
.ni.on .ni-lb{color:var(--azul-m)}
.ni.on .ni-ic svg{stroke:var(--azul-m)}
.n-fab{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--dorado),var(--coral));
  color:white;margin:0 4px;
  box-shadow:0 6px 20px rgba(232,160,32,.45);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;border:none;
  transition:transform .15s,box-shadow .15s;
}
.n-fab:active{transform:scale(.93)}
.n-fab svg{stroke:white;fill:none}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--oscuro);color:white;
  padding:10px 20px;border-radius:50px;
  font-size:.76rem;font-weight:600;
  white-space:nowrap;z-index:9999;
  box-shadow:0 6px 24px rgba(0,0,0,.25);
  display:none;max-width:90vw;text-align:center;
  opacity:0;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--verde)}
#toast.err{background:var(--coral)}
#toast.info{background:var(--azul-m)}

/* ══ LOADER ══ */
#loader{
  position:fixed;inset:0;
  background:rgba(255,255,255,.9);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9998;gap:14px;
  backdrop-filter:blur(2px);
}
.loader-ring{
  width:40px;height:40px;
  border-radius:50%;
  border:3px solid var(--borde);
  border-top-color:var(--azul-m);
  animation:spin .75s linear infinite;
}
.loader-txt{font-size:.78rem;color:var(--gris);font-weight:500}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ SKELETON LOADER ══ */
.skel{
  background:linear-gradient(90deg,#e8edf5 25%,#d4dce8 50%,#e8edf5 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ══ BOTONES ══ */
.btn{
  display:flex;align-items:center;justify-content:center;
  gap:8px;width:100%;padding:14px;
  border-radius:var(--r);font-weight:600;font-size:.86rem;
  cursor:pointer;border:none;
  transition:opacity .18s,transform .14s,box-shadow .18s;
  font-family:var(--font-b);letter-spacing:.01em;
}
.btn:active{opacity:.88;transform:scale(.98)}
.btn-azul{
  background:linear-gradient(135deg,var(--azul) 0%,var(--azul-c) 100%);
  color:white;
  box-shadow:0 4px 18px rgba(11,45,94,.28);
}
.btn-azul:hover{box-shadow:0 6px 22px rgba(11,45,94,.35)}
.btn-dorado{
  background:linear-gradient(135deg,var(--dorado) 0%,var(--dorado-c) 100%);
  color:var(--oscuro);
  box-shadow:0 4px 18px rgba(232,160,32,.32);
}
.btn-wa{
  background:var(--wa);color:white;
  box-shadow:0 4px 16px rgba(37,211,102,.3);
}
.btn-out{
  background:transparent;color:rgba(255,255,255,.75);
  border:1.5px solid rgba(255,255,255,.22);
}
.btn-out:hover{background:rgba(255,255,255,.07)}
.btn-dark{background:var(--oscuro);color:white}
.btn-ghost{background:transparent;color:var(--gris);border:1.5px solid var(--borde)}
.btn-sm{width:auto;padding:7px 16px;border-radius:50px;font-size:.72rem}
.mb10{margin-bottom:10px}
.mb14{margin-bottom:14px}

/* ══ INPUTS ══ */
.finput{
  width:100%;padding:12px 14px;
  background:white;border:1.5px solid var(--borde);
  border-radius:12px;font-size:.82rem;color:var(--oscuro);
  transition:border-color .2s,box-shadow .2s;
  font-family:var(--font-b);
}
.finput:focus{border-color:var(--azul-m);box-shadow:0 0 0 3px var(--azul-bg)}
.finput::placeholder{color:var(--gris-c)}
.finput-wa{border-color:rgba(37,211,102,.4)}
.finput-wa:focus{border-color:var(--wa);box-shadow:0 0 0 3px var(--wa-bg)}
.ftextarea{resize:none;min-height:90px}
.flabel{display:block;font-size:.67rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.fgroup{margin-bottom:13px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fsec{
  font-weight:700;font-size:.76rem;color:var(--oscuro);
  padding:10px 0 7px;
  border-bottom:1.5px solid var(--borde);
  margin:14px 0 12px;
  display:flex;align-items:center;gap:6px;
}

/* ══ HERO HEADERS ══ */
.hero-azul{
  background:linear-gradient(160deg,var(--azul) 0%,var(--azul-m) 55%,#1a3f74 100%);
  padding:0 18px 18px;color:white;
}
.hero-oscuro{
  background:linear-gradient(160deg,var(--oscuro),#1B3A6B);
  padding:0 18px 22px;color:white;
}

/* ══ STATUS BAR AREA ══ */
.sbar{
  display:flex;justify-content:space-between;
  font-size:.6rem;font-weight:700;
  padding:calc(env(safe-area-inset-top,28px) + 10px) 0 10px;
}
.sbar.d{color:rgba(255,255,255,.7)}
.sbar.l{color:var(--oscuro)}

/* ══ SEARCH BAR ══ */
.s-bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:11px 13px;margin-bottom:12px;
  transition:background .2s;
}
.s-bar:focus-within{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
.s-bar input{
  background:transparent;border:none;color:white;
  font-family:var(--font-b);font-size:.8rem;flex:1;
}
.s-bar input::placeholder{color:rgba(255,255,255,.42)}
.s-bar input:focus{outline:none}
.fbtn{
  width:32px;height:32px;border-radius:10px;
  background:var(--dorado);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;
  transition:transform .15s;
}
.fbtn:active{transform:scale(.9)}

/* ══ CHIPS ══ */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.chip{
  padding:6px 14px;border-radius:50px;
  font-size:.68rem;font-weight:600;white-space:nowrap;
  border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.8);
  cursor:pointer;transition:all .18s;
}
.chip.on{background:white;border-color:white;color:var(--azul-m);font-weight:700}

/* ══ SECTIONS ══ */
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
.sec-t{font-family:var(--font-t);font-size:1.05rem;font-weight:700;color:var(--oscuro);letter-spacing:-.3px}
.sec-a{font-size:.7rem;color:var(--azul-m);font-weight:600;cursor:pointer}
.hscroll{display:flex;gap:12px;padding:0 18px 6px;overflow-x:auto}
.page-body{padding:14px 18px}
.sec-titulo{font-weight:700;font-size:.8rem;color:var(--oscuro);margin:14px 0 9px;letter-spacing:.01em}

/* ══ CARD HORIZONTAL ══ */
.hcard{
  width:180px;flex-shrink:0;
  background:white;border-radius:20px;
  overflow:hidden;box-shadow:var(--shadow);
  border:1px solid var(--borde);
  cursor:pointer;transition:transform .2s,box-shadow .2s;
}
.hcard:active{transform:scale(.97);box-shadow:var(--shadow-sm)}
.hcard-img{
  width:100%;height:110px;
  display:flex;align-items:center;justify-content:center;
  font-size:2.8rem;position:relative;
  background-size:cover;background-position:center;
}
.hcard-body{padding:10px 13px 13px}
.hcard-name{
  font-weight:700;font-size:.8rem;color:var(--oscuro);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;
}
.hcard-loc{font-size:.65rem;color:var(--gris);margin-bottom:7px;display:flex;align-items:center;gap:3px}
.hcard-ft{display:flex;justify-content:space-between;align-items:flex-end}

/* ══ CARD VERTICAL ══ */
.vcard{
  background:white;border-radius:20px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(11,30,56,.07);
  border:1px solid var(--borde);
  margin-bottom:13px;cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.vcard:active{transform:scale(.99);box-shadow:var(--shadow-sm)}
.vcard-img{
  width:100%;height:178px;
  display:flex;align-items:center;justify-content:center;
  font-size:4rem;position:relative;
  background-size:cover;background-position:center;
}
.vcard-body{padding:14px}

/* ══ PRICE / STARS ══ */
.price{font-family:var(--font-t);font-size:.95rem;font-weight:700;color:var(--azul-m)}
.price small{font-family:var(--font-b);font-size:.58rem;color:var(--gris);font-weight:400}
.price-usd{font-size:.63rem;color:var(--gris-c);margin-left:4px}
.stars{font-size:.65rem;color:var(--dorado);font-weight:700;display:flex;align-items:center;gap:2px}

/* ══ BADGES ══ */
.badge{
  position:absolute;
  font-size:.52rem;font-weight:800;
  padding:3px 9px;border-radius:7px;
  letter-spacing:.06em;text-transform:uppercase;
}
.b-tl{top:10px;left:10px}
.b-nuevo{background:var(--coral);color:white}
.b-top{background:var(--dorado);color:var(--oscuro)}
.b-fav{
  position:absolute;top:10px;right:10px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(4px);
  transition:transform .15s;
}
.b-fav:active{transform:scale(.88)}
.b-fav svg{stroke:#94A3B8;fill:none;transition:stroke .2s,fill .2s}
.b-fav:hover svg,.b-fav.on svg{stroke:var(--coral);fill:var(--coral)}

/* ══ AVATAR ══ */
.av{
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;color:white;
  flex-shrink:0;background:linear-gradient(135deg,var(--azul-m),var(--dorado));
  position:relative;
}
.av-sm{width:36px;height:36px;font-size:.76rem}
.av-md{width:46px;height:46px;font-size:.9rem}
.av-lg{width:78px;height:78px;font-size:1.6rem}
.av-on::after{
  content:'';position:absolute;bottom:1px;right:1px;
  width:11px;height:11px;border-radius:50%;
  background:var(--verde);border:2px solid white;
}

/* ══ MAP ══ */
.map-box{
  margin:4px 18px;height:128px;border-radius:20px;
  background:linear-gradient(145deg,#BDD5BF,#9CC4A0);
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.map-box::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);
  background-size:20px 20px;
}
.map-rh{position:absolute;top:50%;left:0;right:0;height:8px;background:rgba(255,255,255,.5);transform:translateY(-50%)}
.map-rv{position:absolute;left:38%;top:0;bottom:0;width:8px;background:rgba(255,255,255,.5)}
.map-pin{
  position:absolute;z-index:2;
  width:24px;height:24px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.map-pin::after{
  content:'';width:9px;height:9px;
  background:white;border-radius:50%;
  transform:rotate(45deg);display:block;margin:7px auto 0;
}
.map-lbl{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(11,30,56,.85);color:white;
  font-size:.62rem;font-weight:700;
  padding:5px 14px;border-radius:50px;white-space:nowrap;
  backdrop-filter:blur(4px);
}

/* ══ AVISO / CALLOUT ══ */
.aviso{
  display:flex;gap:10px;align-items:flex-start;
  border-radius:14px;padding:12px 14px;margin-bottom:12px;
  font-size:.76rem;line-height:1.6;color:var(--oscuro);
}
.aviso b{font-weight:700}
.av-wa{background:var(--wa-bg);border:1.5px solid rgba(37,211,102,.25)}
.av-info{background:var(--azul-bg);border:1.5px solid rgba(27,79,138,.18)}

/* ══ CONVERSATIONS ══ */
.conv{
  display:flex;align-items:center;gap:12px;
  padding:13px 18px;
  border-bottom:1px solid var(--borde);
  background:white;cursor:pointer;
  transition:background .18s;
}
.conv:hover{background:var(--fondo2)}
.conv.unread{background:#F0F5FF}
.conv-body{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;margin-bottom:2px}
.conv-name{font-weight:700;font-size:.82rem;color:var(--oscuro)}
.conv-time{font-size:.62rem;color:var(--gris-c)}
.conv-prop{font-size:.65rem;color:var(--azul-m);font-weight:600;margin-bottom:2px}
.conv-last{font-size:.72rem;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-last.b{color:var(--oscuro);font-weight:600}
.ubadge{
  background:var(--azul-m);color:white;
  font-size:.58rem;font-weight:800;
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ══ BUBBLES CHAT ══ */
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;font-size:.76rem;line-height:1.55}
.b-them{background:white;color:var(--oscuro);border:1px solid var(--borde);border-bottom-left-radius:5px;align-self:flex-start}
.b-me{background:var(--azul-m);color:white;border-bottom-right-radius:5px;align-self:flex-end}
.btime{font-size:.56rem;color:var(--gris-c);margin-top:3px}
.btime.me{color:rgba(255,255,255,.5);text-align:right}

/* ══ TIPO OPTS ══ */
.tipo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tipo-opt{
  border:1.5px solid var(--borde);border-radius:12px;
  padding:10px 5px;text-align:center;cursor:pointer;
  background:white;font-size:.72rem;font-weight:600;
  color:var(--oscuro);transition:all .18s;
}
.tipo-opt.on{border-color:var(--azul-m);background:var(--azul-bg);color:var(--azul-m)}

/* ══ COMODIDADES ══ */
.como-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.como-item{
  display:flex;align-items:center;gap:7px;
  background:white;border:1.5px solid var(--borde);
  border-radius:10px;padding:9px 10px;cursor:pointer;
  font-size:.7rem;font-weight:600;color:var(--oscuro);
  transition:all .18s;text-align:left;
}
.como-item.on{border-color:var(--azul-m);background:var(--azul-bg);color:var(--azul-m)}
.cbox{
  width:16px;height:16px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;flex-shrink:0;transition:all .2s;
  border:1.5px solid var(--borde);
}
.cbox.off{background:var(--borde);color:transparent;border-color:transparent}
.como-item.on .cbox{background:var(--azul-m);color:white;border-color:var(--azul-m)}

/* ══ DETALLE ══ */
.det-img{
  height:230px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background-size:cover;background-position:center;
}
.det-back{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 44px);left:16px;
  background:rgba(255,255,255,.95);color:var(--oscuro);
  padding:8px 16px;border-radius:50px;
  font-size:.72rem;font-weight:700;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  border:none;cursor:pointer;display:flex;align-items:center;gap:5px;
  backdrop-filter:blur(4px);
}
.det-fav{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 44px);right:16px;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  border:none;cursor:pointer;backdrop-filter:blur(4px);
}
.det-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.ddot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s}
.ddot.on{background:white;width:18px;border-radius:3px}
.det-pr-row{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#EBF3FF,#F5F9FF);
  border:1.5px solid #C8DCFB;border-radius:16px;
  padding:13px 16px;margin-bottom:14px;
}
.det-pr{font-family:var(--font-t);font-size:1.55rem;font-weight:900;color:var(--azul-m);letter-spacing:-.5px}
.dtag{
  background:var(--azul-bg);color:var(--azul-m);
  padding:5px 11px;border-radius:10px;
  font-size:.64rem;font-weight:700;
}
.amen-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.amen{
  background:var(--fondo);border:1px solid var(--borde);
  border-radius:11px;padding:9px 11px;
  display:flex;align-items:center;gap:7px;
  font-size:.72rem;font-weight:500;
}
.owner-card{
  display:flex;align-items:center;gap:11px;
  background:var(--fondo2);border:1.5px solid var(--borde);
  border-radius:16px;padding:13px;margin-bottom:14px;
}
.resena{
  background:var(--fondo2);border:1px solid var(--borde);
  border-radius:13px;padding:11px 13px;margin-bottom:9px;
}

/* ══ CHAT ══ */
.chat-wrap{display:flex;flex-direction:column;height:100vh;background:#EBF0F8}
.chat-head{
  background:white;border-bottom:1px solid var(--borde);
  padding:calc(env(safe-area-inset-top,28px) + 8px) 16px 12px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.chat-prop-b{
  background:var(--fondo2);border-bottom:1px solid var(--borde);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 14px;display:flex;flex-direction:column;gap:8px}
.chat-ibar{
  background:white;border-top:1px solid var(--borde);
  padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.chat-inp{
  flex:1;background:var(--fondo);border:1px solid var(--borde);
  border-radius:50px;padding:10px 16px;
  font-size:.78rem;color:var(--oscuro);font-family:var(--font-b);
}
.chat-inp:focus{outline:none;border-color:var(--azul-m)}
.send-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--azul-m);display:flex;align-items:center;justify-content:center;
  color:white;flex-shrink:0;cursor:pointer;border:none;
  transition:transform .15s,background .18s;
}
.send-btn:active{transform:scale(.9)}

/* ══ PERFIL ══ */
.pmenu{background:white;border-radius:18px;overflow:hidden;border:1px solid var(--borde);margin-bottom:12px}
.pitem{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--borde);
  cursor:pointer;transition:background .18s;
}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:var(--fondo2)}
.pic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ptxt{flex:1}
.pm{font-size:.82rem;font-weight:600;color:var(--oscuro)}
.ps{font-size:.66rem;color:var(--gris)}
.pbadge{background:var(--azul-m);color:white;font-size:.6rem;font-weight:800;padding:2px 9px;border-radius:50px}
.secth{font-size:.65rem;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px}

/* ══ BIENVENIDA / SPLASH ══ */
.splash{
  min-height:100vh;
  background:linear-gradient(170deg,#060D1C 0%,#0B1E38 40%,#0D2649 70%,#0F2E50 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px calc(40px + env(safe-area-inset-bottom,0px));
  position:relative;overflow:hidden;text-align:center;
}
.splash-grain{
  position:absolute;inset:0;opacity:.03;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px;
}
.orb1{
  position:absolute;top:-120px;right:-100px;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,160,32,.15),transparent 70%);
  pointer-events:none;
}
.orb2{
  position:absolute;bottom:60px;left:-100px;
  width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(27,79,138,.25),transparent 70%);
  pointer-events:none;
}
.sp-logo{
  width:88px;height:88px;border-radius:24px;
  background:linear-gradient(135deg,var(--dorado),var(--coral));
  display:flex;align-items:center;justify-content:center;
  margin-bottom:22px;
  box-shadow:0 20px 50px rgba(232,160,32,.35),0 0 0 1px rgba(255,255,255,.08);
  position:relative;z-index:2;
  font-size:2.5rem;
}
.sp-logo-inner{
  font-family:var(--font-t);color:white;font-size:2rem;font-weight:900;line-height:1;
}
.sp-titulo{
  font-family:var(--font-t);color:white;font-size:2.9rem;font-weight:900;
  letter-spacing:-1.8px;margin-bottom:6px;position:relative;z-index:2;
  line-height:1;
}
.sp-sub{
  color:rgba(232,160,32,.85);font-size:.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.15em;
  margin-bottom:20px;position:relative;z-index:2;
}
.sp-desc{
  color:rgba(255,255,255,.48);font-size:.84rem;
  line-height:1.75;margin-bottom:28px;position:relative;z-index:2;
  max-width:280px;
}
.sp-trust{
  display:flex;gap:24px;margin-bottom:32px;
  position:relative;z-index:2;
}
.sp-tn{font-family:var(--font-t);color:var(--dorado-c);font-size:1.15rem;font-weight:700;display:block}
.sp-tl{color:rgba(255,255,255,.32);font-size:.6rem}
.sp-tdiv{width:1px;background:rgba(255,255,255,.1);align-self:stretch}
.sp-btns{width:100%;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.sp-legal{color:rgba(255,255,255,.2);font-size:.6rem;line-height:1.8;margin-top:16px;position:relative;z-index:2}
.sp-legal u{color:rgba(232,160,32,.6);cursor:pointer}

/* ══ MISC UTILS ══ */
.pb-nav{padding-bottom:calc(var(--nav-h) + 8px)}
.divider-or{
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;color:var(--gris-c);font-size:.74rem;
}
.divider-or::before,.divider-or::after{
  content:'';flex:1;height:1px;background:var(--borde);
}

/* ══ VERIFICADO BADGE ══ */
.ver-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:rgba(16,185,129,.1);color:#0a8060;
  font-size:.62rem;font-weight:700;
  padding:3px 8px;border-radius:6px;
}
</style>
</head>
<body>

<div id="app" class="no-nav">
  <!-- SPLASH INICIAL — skeleton animado mientras carga -->
  <div id="page">
    <div style="min-height:100vh;background:linear-gradient(170deg,#060D1C,#0B1E38 40%,#0D2649);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:40px 28px">
      <!-- Logo animado -->
      <div style="width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,#E8A020,#E85D3A);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 20px 50px rgba(232,160,32,.3);animation:pulse 1.8s ease-in-out infinite">
        <span style="font-family:'Fraunces',serif;color:white;font-size:2rem;font-weight:900">C</span>
      </div>
      <p style="font-family:'Fraunces',serif;color:white;font-size:2rem;font-weight:900;letter-spacing:-1px;margin-bottom:4px">CasaRD</p>
      <p style="color:rgba(232,160,32,.7);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;margin-bottom:32px">República Dominicana</p>
      <!-- Skeleton cards preview -->
      <div style="display:flex;gap:10px;margin-bottom:8px">
        <div class="skel" style="width:130px;height:160px;border-radius:16px"></div>
        <div class="skel" style="width:130px;height:160px;border-radius:16px;animation-delay:.2s"></div>
        <div class="skel" style="width:130px;height:160px;border-radius:16px;animation-delay:.4s"></div>
      </div>
      <p style="color:rgba(255,255,255,.2);font-size:.7rem;margin-top:18px">Cargando propiedades…</p>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav oculto" id="bnav">
  <!-- Inicio -->
  <div class="ni" id="ni-inicio" onclick="ir('explorar')">
    <span class="ni-ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </span>
    <span class="ni-lb">Inicio</span>
  </div>
  <!-- Buscar -->
  <div class="ni" id="ni-buscar" onclick="ir('explorar')">
    <span class="ni-ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </span>
    <span class="ni-lb">Buscar</span>
  </div>
  <!-- FAB Publicar -->
  <button class="n-fab" onclick="ir('publicar')" aria-label="Publicar propiedad">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
  <!-- Mensajes -->
  <div class="ni" id="ni-mensajes" onclick="ir('mensajes')">
    <span class="ni-ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </span>
    <span class="ni-lb">Mensajes</span>
  </div>
  <!-- Perfil -->
  <div class="ni" id="ni-perfil" onclick="ir('perfil')">
    <span class="ni-ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </span>
    <span class="ni-lb">Perfil</span>
  </div>
</nav>

<!-- TOAST -->
<div id="toast"></div>

<!-- LOADER -->
<div id="loader">
  <div class="loader-ring"></div>
  <p class="loader-txt">Cargando…</p>
</div>

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
</style>
